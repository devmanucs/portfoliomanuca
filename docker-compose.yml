services:
  postgres:
    image: postgres:16
    container_name: portfoliomanuca-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfoliomanuca
    volumes:
      - portfoliomanuca_pg_data:/var/lib/postgresql/data

volumes:
  portfoliomanuca_pg_data:
